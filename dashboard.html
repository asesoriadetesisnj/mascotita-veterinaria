<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mascotita - Panel</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#10a76f">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Mascotita - Sistema de gestion veterinaria">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/dark-mode.css">
</head>
<body>
  <div id="app-shell"></div>

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <!-- Modulos propios -->
  <script src="js/firebase-config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/auditoria.js"></script>
  <script src="js/global-search.js"></script>

  <script>
  /* ---------------------------------------------------------------
   * Panel principal: accesos rapidos, conteos y "que requiere atencion
   * hoy" (citas de hoy, stock bajo, vacunas por vencer, controles).
   * --------------------------------------------------------------- */
  function leer(col, fn) {
    return fn(db.collection(col)).get()
      .then(function (s) { return s.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }); })
      .catch(function () { return []; });
  }
  function bloque(icono, titulo, items, href, clase) {
    return '<div class="card-chart aviso ' + (clase || "") + '"><h3><i class="fa-solid ' + icono + '"></i> ' + titulo +
      ' <span class="pill">' + items.length + '</span></h3>' +
      (items.length ? '<ul class="lista-aviso">' + items.slice(0, 6).map(function (x) { return '<li>' + x + '</li>'; }).join("") + '</ul>'
        : '<p class="vacio">Todo en orden.</p>') +
      (items.length > 6 ? '<a class="ver-mas" href="' + href + '">Ver los ' + items.length + ' &rarr;</a>' : '<a class="ver-mas" href="' + href + '">Abrir &rarr;</a>') + '</div>';
  }

  async function initDashboard() {
    const u = await protegerPagina({ pagina: "dashboard.html" });
    const esAdmin = u.role === "admin";
    const cont = document.getElementById("content");
    const hora = new Date().getHours();
    const saludo = hora < 12 ? "Buenos dias" : (hora < 19 ? "Buenas tardes" : "Buenas noches");
    cont.innerHTML =
      '<div class="bienvenida"><h1>' + saludo + ', ' + escHTML(u.nombre) + '</h1>' +
      '<p>' + new Date().toLocaleDateString("es-PY", { weekday: "long", day: "numeric", month: "long", year: "numeric" }) + '</p></div>' +
      '<div class="dash-grid" id="dash-grid"></div>' +
      '<div class="grid-avisos" id="dash-avisos"></div>';

    mostrarLoading(true);
    try {
      const hoy0 = inicioDelDia(new Date()), hoy1 = finDelDia(new Date());
      const lim = new Date(); lim.setDate(lim.getDate() + 30);
      const ts = firebase.firestore.Timestamp.fromDate;
      const cols = [
        { col: "mascotas", icon: "fa-paw", label: "Mascotas", href: "consultas.html" },
        { col: "consultas", icon: "fa-stethoscope", label: "Consultas", href: "consultas.html" },
        { col: "cirugias", icon: "fa-syringe", label: "Cirugias", href: "cirugias.html" },
        { col: "citas", icon: "fa-calendar-days", label: "Citas", href: "citas.html" },
        { col: "productos", icon: "fa-boxes-stacked", label: "Productos", href: "stock.html" }
      ];
      if (esAdmin) cols.push({ col: "facturas", icon: "fa-file-invoice-dollar", label: "Facturas", href: "facturas.html" });

      const r = await Promise.all([
        Promise.all(cols.map(function (c) {
          return db.collection(c.col).get().then(function (s) { return s.size; }).catch(function () { return 0; });
        })),
        leer("citas", function (q) { return q.where("fecha", ">=", ts(hoy0)).where("fecha", "<=", ts(hoy1)); }),
        leer("productos", function (q) { return q; }),
        leer("vacunas", function (q) { return q.where("proximaDosis", "<=", ts(lim)).limit(100); }),
        leer("consultas", function (q) { return q.where("proximoControl", ">=", ts(hoy0)).where("proximoControl", "<=", ts(lim)).limit(100); })
      ]);
      document.getElementById("dash-grid").innerHTML = cols.map(function (c, i) {
        return '<div class="dash-card" onclick="location.href=\'' + c.href + '\'">' +
          '<i class="fa-solid ' + c.icon + '"></i>' +
          '<div><h3>' + r[0][i] + '</h3><p>' + c.label + '</p></div></div>';
      }).join("");

      const citasHoy = r[1].filter(function (c) { return c.estado !== "cancelada"; })
        .sort(function (a, b) { return (a.hora || "").localeCompare(b.hora || ""); })
        .map(function (c) { return '<b>' + escHTML(c.hora || "--:--") + '</b> ' + escHTML(c.mascota || "") + ' <span class="muted">' + escHTML(c.servicio || "") + '</span>'; });
      const bajos = r[2].filter(function (p) { return Number(p.cantidad) <= Number(p.minimoStock || 0); })
        .map(function (p) { return escHTML(p.nombre) + ' <span class="pill pill-warn">' + escHTML(p.cantidad) + ' / min ' + escHTML(p.minimoStock || 0) + '</span>'; });
      const vencen = r[2].filter(function (p) { return p.fechaVencimiento && venceEnDiasDash(p.fechaVencimiento, 30); })
        .map(function (p) { return escHTML(p.nombre) + ' <span class="pill pill-danger">' + fmtFechaCorta(p.fechaVencimiento) + '</span>'; });
      const vacs = r[3].map(function (v) {
        const d = v.proximaDosis.toDate();
        return escHTML(v.mascota) + ' - ' + escHTML(v.tipo) + ' <span class="pill ' + (d < hoy0 ? "pill-danger" : "pill-warn") + '">' + fmtFechaCorta(v.proximaDosis) + '</span>';
      });
      const ctrls = r[4].map(function (c) { return escHTML(c.mascota) + ' <span class="pill">' + fmtFechaCorta(c.proximoControl) + '</span>'; });

      document.getElementById("dash-avisos").innerHTML =
        bloque("fa-calendar-check", "Citas de hoy", citasHoy, "citas.html") +
        bloque("fa-triangle-exclamation", "Stock bajo", bajos, "stock.html", bajos.length ? "alerta" : "") +
        bloque("fa-clock", "Productos por vencer (30 dias)", vencen, "stock.html", vencen.length ? "alerta" : "") +
        bloque("fa-shield-virus", "Vacunas vencidas o por vencer", vacs, "vacunas.html", vacs.length ? "alerta" : "") +
        bloque("fa-notes-medical", "Controles proximos (30 dias)", ctrls, "consultas.html");
    } catch (e) { console.error(e); toast("Error cargando el panel.", "error"); }
    finally { mostrarLoading(false); }
  }
  function venceEnDiasDash(f, dias) {
    const d = f.toDate ? f.toDate() : new Date(f);
    const l = new Date(); l.setDate(l.getDate() + dias); return d <= l;
  }
  document.addEventListener("DOMContentLoaded", initDashboard);
  </script>
</body>
</html>
