<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mascotita - Panel</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/dark-mode.css">
</head>
<body>
  <div id="app-shell"></div>

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <!-- Modulos propios -->
  <script src="js/firebase-config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/auditoria.js"></script>
  <script src="js/global-search.js"></script>

  <script>
  /* ---------------------------------------------------------------
   * Panel principal: tarjetas con conteos rapidos de cada modulo.
   * --------------------------------------------------------------- */
  async function initDashboard() {
    const u = await protegerPagina({ pagina: "dashboard.html" });
    const esAdmin = u.role === "admin";
    const cont = document.getElementById("content");
    cont.innerHTML =
      '<div class="bienvenida"><h1>Hola, ' + escHTML(u.nombre) + '</h1>' +
      '<p>Bienvenido al panel de Mascotita.</p></div>' +
      '<div class="dash-grid" id="dash-grid"></div>';

    mostrarLoading(true);
    try {
      const cols = [
        { col: "mascotas", icon: "fa-paw", label: "Mascotas", href: "consultas.html" },
        { col: "consultas", icon: "fa-stethoscope", label: "Consultas", href: "consultas.html" },
        { col: "cirugias", icon: "fa-syringe", label: "Cirugias", href: "cirugias.html" },
        { col: "citas", icon: "fa-calendar-days", label: "Citas", href: "citas.html" },
        { col: "productos", icon: "fa-boxes-stacked", label: "Productos", href: "stock.html" }
      ];
      if (esAdmin) cols.push({ col: "facturas", icon: "fa-file-invoice-dollar", label: "Facturas", href: "facturas.html" });
      const conteos = await Promise.all(cols.map(function (c) {
        return db.collection(c.col).get().then(function (s) { return s.size; }).catch(function () { return 0; });
      }));
      document.getElementById("dash-grid").innerHTML = cols.map(function (c, i) {
        return '<div class="dash-card" onclick="location.href=\'' + c.href + '\'">' +
          '<i class="fa-solid ' + c.icon + '"></i>' +
          '<div><h3>' + conteos[i] + '</h3><p>' + c.label + '</p></div></div>';
      }).join("");
    } catch (e) { console.error(e); toast("Error cargando el panel.", "error"); }
    finally { mostrarLoading(false); }
  }
  document.addEventListener("DOMContentLoaded", initDashboard);
  </script>
</body>
</html>
