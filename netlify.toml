# =====================================================================
# netlify.toml - Configuracion de despliegue en Netlify
# ---------------------------------------------------------------------
# El sitio es 100% estatico, no requiere comando de build.
# publish = "." indica que la raiz del repo es el sitio a publicar.
# =====================================================================

[build]
  publish = "."
  command = ""

# Cabeceras de seguridad para toda la app.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

# El service worker y el manifest siempre deben revalidarse para que las
# actualizaciones de la app lleguen al instante.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

# Iconos y logo: cambian poco, se cachean una semana.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Herramientas de instalacion (p. ej. crear-admin): NUNCA visibles en produccion.
[[redirects]]
  from = "/tools/*"
  to = "/index.html"
  status = 404
  force = true

# Si alguien entra a una ruta inexistente, va al login.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
