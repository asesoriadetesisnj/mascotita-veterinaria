<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mascotita - Configuracion</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#10a76f">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Mascotita - Sistema de gestion veterinaria">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/dark-mode.css">
</head>
<body>
  <div id="app-shell"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/auditoria.js"></script>
  <script src="js/global-search.js"></script>
  <script src="js/notifications.js"></script>

  <script>
  /* ---------------------------------------------------------------
   * Configuracion general (solo ADMIN): IVA, emails de notificacion,
   * plantilla de alerta de stock y plantillas de WhatsApp.
   * --------------------------------------------------------------- */
  async function initConfig() {
    await protegerPagina({ soloAdmin: true, pagina: "configuracion.html" });
    const cont = document.getElementById("content");
    const cfg = await cargarConfig();
    const wa = {};
    try {
      const snap = await db.collection("plantillas_whatsapp").get();
      snap.forEach(function (d) { wa[d.id] = d.data().texto; });
    } catch (e) { /* usar vacios */ }

    cont.innerHTML =
      '<div class="page-head"><h1><i class="fa-solid fa-gear"></i> Configuracion</h1></div>' +
      '<div class="card-chart"><h3>Datos de la clinica (aparecen en los PDF)</h3><div class="grid-2">' +
      '<div class="form-field"><label>Nombre</label><input id="c-clinica" value="' + escHTML(cfg.clinicaNombre || "Mascotita") + '"></div>' +
      '<div class="form-field"><label>RUC</label><input id="c-ruc" value="' + escHTML(cfg.clinicaRuc || "") + '"></div>' +
      '<div class="form-field"><label>Telefono</label><input id="c-tel" value="' + escHTML(cfg.clinicaTelefono || "") + '"></div>' +
      '<div class="form-field"><label>Direccion</label><input id="c-dir" value="' + escHTML(cfg.clinicaDireccion || "") + '"></div></div></div>' +
      '<div class="card-chart" style="margin-top:16px"><h3>Facturacion</h3>' +
      '<div class="form-field"><label>IVA (%)</label><input type="number" id="c-iva" value="' + (cfg.iva != null ? cfg.iva : 10) + '"></div></div>' +
      '<div class="card-chart" style="margin-top:16px"><h3>Notificaciones de stock bajo (EmailJS)</h3>' +
      '<div class="form-field"><label>Emails destinatarios (separados por coma)</label>' +
      '<input type="text" id="c-emails" value="' + escHTML(cfg.emailsNotificacion || "") + '" placeholder="admin@correo.com, encargado@correo.com"></div>' +
      '<div class="form-field full"><label>Plantilla del email (variables: {producto} {cantidad} {minimo})</label>' +
      '<textarea id="c-plantilla-stock" rows="3">' + escHTML(cfg.plantillaStockBajo || "ALERTA: el producto {producto} tiene stock bajo. Cantidad actual: {cantidad} (minimo: {minimo}).") + '</textarea></div></div>' +
      '<div class="card-chart" style="margin-top:16px"><h3>Plantillas de WhatsApp (variables: {nombre} {mascota} {fecha})</h3>' +
      '<div class="form-field full"><label>Recordatorio de cita</label><textarea id="c-wa-cita" rows="2">' + escHTML(wa.recordatorio_cita || "Hola {nombre}, te recordamos la cita de {mascota} para el {fecha} en Veterinaria Mascotita. Gracias!") + '</textarea></div>' +
      '<div class="form-field full"><label>Vacuna</label><textarea id="c-wa-vacuna" rows="2">' + escHTML(wa.vacuna || "Hola {nombre}, {mascota} tiene pendiente su vacuna. Agenda tu turno en Veterinaria Mascotita.") + '</textarea></div>' +
      '<div class="form-field full"><label>Control</label><textarea id="c-wa-control" rows="2">' + escHTML(wa.control || "Hola {nombre}, es momento del control de {mascota}. Te esperamos en Mascotita.") + '</textarea></div></div>' +
      '<div style="margin-top:16px"><button class="btn btn-primary" id="c-guardar"><i class="fa-solid fa-floppy-disk"></i> Guardar configuracion</button></div>';

    document.getElementById("c-guardar").onclick = async function () {
      mostrarLoading(true);
      try {
        await db.collection("config").doc("general").set({
          iva: Math.min(100, Math.max(0, Number(document.getElementById("c-iva").value) || 0)),
          clinicaNombre: document.getElementById("c-clinica").value.trim() || "Mascotita",
          clinicaRuc: document.getElementById("c-ruc").value.trim(),
          clinicaTelefono: document.getElementById("c-tel").value.trim(),
          clinicaDireccion: document.getElementById("c-dir").value.trim(),
          emailsNotificacion: document.getElementById("c-emails").value.trim(),
          plantillaStockBajo: document.getElementById("c-plantilla-stock").value.trim()
        }, { merge: true });
        await db.collection("plantillas_whatsapp").doc("recordatorio_cita").set({ texto: document.getElementById("c-wa-cita").value.trim() });
        await db.collection("plantillas_whatsapp").doc("vacuna").set({ texto: document.getElementById("c-wa-vacuna").value.trim() });
        await db.collection("plantillas_whatsapp").doc("control").set({ texto: document.getElementById("c-wa-control").value.trim() });
        await cargarConfig(true);
        await registrarAuditoria("editar", "configuracion", "Actualizo la configuracion general");
        toast("Configuracion guardada.", "ok");
      } catch (e) { console.error(e); toast("Error al guardar.", "error"); }
      finally { mostrarLoading(false); }
    };
  }
  document.addEventListener("DOMContentLoaded", initConfig);
  </script>
</body>
</html>
